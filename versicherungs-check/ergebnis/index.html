<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="robots" content="noindex">
  <style>
    .res-wrap{max-width:680px;margin:0 auto;padding:32px 20px 64px}
    .res-ampel{display:flex;align-items:center;gap:16px;border-radius:16px;padding:20px 22px;margin:14px 0 26px;border:1.5px solid}
    .res-ampel.rot{background:rgba(210,60,50,.10);border-color:rgba(210,60,50,.5)}
    .res-ampel.gelb{background:rgba(255,160,0,.10);border-color:rgba(255,160,0,.5)}
    .res-ampel.gruen{background:rgba(60,160,90,.12);border-color:rgba(60,160,90,.5)}
    .res-dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
    .rot .res-dot{background:#d23c32}.gelb .res-dot{background:#ffa000}.gruen .res-dot{background:#3ca05a}
    .res-ampel b{font-size:1.05rem}
    .res-block{border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;background:rgba(255,255,255,.02)}
    .res-block h3{margin:0 0 6px;font-size:1.05rem}
    .res-block p{margin:0;color:var(--txt2,#8888a0);line-height:1.6}
    .res-vor{border:1px solid var(--acc,#ff7a00);background:rgba(255,122,0,.07);border-radius:14px;padding:18px 20px;margin:18px 0}
    .res-lead{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:26px}
    .res-lead label{display:block;font-size:.85rem;color:var(--txt2,#8888a0);margin:12px 0 4px}
    .res-lead input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border,rgba(255,255,255,.14));background:rgba(0,0,0,.25);color:inherit;font-size:1rem}
    .res-lead .consent{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:.85rem;color:var(--txt2,#8888a0)}
    .res-hp{position:absolute;left:-9999px}
    .res-foot{font-size:.8rem;color:var(--txt2,#8888a0);margin-top:22px;line-height:1.6;border-top:1px solid var(--border);padding-top:16px}
    /* Plausibilitaetspruefung (assets/js/plausi.js, 25.09.2026) */
    .plausi-meldung{margin:6px 0 0;font-size:.875rem;line-height:1.4;color:#ffb4a8;overflow-wrap:anywhere}
    [aria-invalid="true"]{border-color:#ef4444 !important;box-shadow:0 0 0 1px #ef4444}
  </style>
<!-- Consent ADVANCED (05.10.2026, Sven): Google Ads + GA4 laden sofort (assets/js/vf-messung.js); ohne Einwilligung

<body>
<nav><div class="nav-inner"><a href="/" class="nav-logo"><img src="/assets/img/logo-header@2x.png" width="121" height="52" alt="VersicherungsFuchs"></a>
  <div class="nav-links"><a href="/versicherungs-check/">Alle Checks</a></div></div></nav>

<main class="res-wrap" id="res">
  <p style="color:var(--txt2,#8888a0)">Ihr Ergebnis wird geladen …</p>
</main>

<script src="/assets/js/plausi.js?v=1.1.0"></script>
<script src="/assets/js/plausi-messung.js?v=1.1.0"></script>

<script src="/assets/js/state.js"></script>
<script src="/assets/js/vf-checks.js"></script>
<script>
(function(){
  var params=new URLSearchParams(window.location.search);
  var type=(params.get('type')||'').toLowerCase();
  var check=window.VF_CHECKS[type];
  if(!check){ window.location.replace('/versicherungs-check/'); return; }
  var KEY='vf_ans_'+type;
  var answers={}; try{answers=JSON.parse(sessionStorage.getItem(KEY))||{};}catch(e){}
  if(!answers || Object.keys(answers).length<3){ window.location.replace('/versicherungs-check/q/?type='+type+'&n=0'); return; }

  var r=check.score(answers);
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var html='<span class="check-hero-badge">'+esc(check.kurz)+' · Ihre Orientierung</span>';
  html+='<h1 style="margin:.2em 0 .1em">'+esc(r.titel)+'</h1>';
  html+='<div class="res-ampel '+r.ampel+'"><span class="res-dot"></span><div><b>Orientierung: '+esc(r.ampelLabel)+'</b>'
    +'<div style="color:var(--txt2,#8888a0);font-size:.92rem;margin-top:2px">Eine erste Einordnung auf Basis Ihrer Angaben – <strong>kein abschließendes Urteil</strong> und keine Produktempfehlung. Die Details klärt ein Berater mit Ihnen.</div></div></div>';
  html+='<p style="color:var(--txt2,#8888a0);line-height:1.6;margin:0 0 6px">Das sind die Punkte, die in Ihrer Lage typischerweise offen sind – und warum man sie einzeln anschauen sollte:</p>';
  r.bloecke.forEach(function(b){ html+='<div class="res-block"><h3>'+esc(b.h)+'</h3><p>'+b.t+'</p></div>'; });
  // First-Principles: offen zeigen, was der Check NICHT wissen kann (Landkarte statt Urteil).
  html+='<div class="res-block" style="background:transparent"><h3>Was dieser Check noch nicht weiß</h3>'
    +'<p>Wenige Fragen können Ihre Situation nur grob einordnen. Ihr genauer Beruf, bestehende Vertragsdetails, '
    +'Ihr Gesundheitszustand und Ihre Ziele fließen erst im persönlichen Gespräch ein. Deshalb ist das hier ein '
    +'Ausgangspunkt – ein unabhängiger Berater bestätigt oder verfeinert die Einordnung mit Ihnen.</p></div>';
  if(r.voranfrage){
    html+='<div class="res-vor"><strong>Ihr wertvoller nächster Schritt: die anonyme Risiko-Voranfrage.</strong>'
      +'<p style="color:var(--txt2,#8888a0);margin:.4em 0 0;line-height:1.6">Wir fragen für Sie – ohne Ihren Namen – bei mehreren Versicherern an, wie sie Ihre Situation einschätzen. So kennen Sie Ihre echten Chancen, bevor irgendwo ein Antrag steht. Das kostet Sie nichts.</p></div>';
  }
  // Nächster Schritt: bei Voranfrage -> Gesundheitsfragebogen; sonst -> einfaches Lead-Formular
  if(r.voranfrage){
    html+='<div class="res-lead"><h3 style="margin:0 0 4px">Ihre echten Chancen klären lassen</h3>'
      +'<p style="color:var(--txt2,#8888a0);margin:0 0 6px;font-size:.92rem">Wir fragen für Sie bei mehreren Versicherern vorab an, wie sie Ihre Situation einschätzen – <strong>mit Ihrem Gesundheitsprofil, aber ohne Ihren Namen</strong>. So kennen Sie Ihre Konditionen, bevor irgendwo ein Antrag steht. Ihre Kontaktdaten brauchen wir nur, um Ihnen Ihr Ergebnis mitzuteilen.</p>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--txt2,#8888a0);margin:4px 0 10px"><span>✓ Kostenlos &amp; unverbindlich</span><span>✓ Keine Verpflichtung</span><span>✓ Daten verschlüsselt</span></div>'
      +'<a class="btn-primary btn-lg" style="width:100%;justify-content:center" href="/versicherungs-check/voranfrage/?type='+encodeURIComponent(type)+'"><span>Chancen kostenlos prüfen lassen</span></a></div>';
  } else {
    html+='<div class="res-lead"><h3 style="margin:0 0 4px">Kostenlose Einordnung anfordern</h3>'
      +'<p style="color:var(--txt2,#8888a0);margin:0;font-size:.92rem">Ein unabhängiger Berater meldet sich bei Ihnen – kostenlos und unverbindlich.</p>'
      +'<form id="leadform" novalidate>'
      +'<input class="res-hp" type="text" name="botcheck" tabindex="-1" autocomplete="off">'
      +'<label for="lf-name">Name</label><input id="lf-name" name="name" autocomplete="name" required data-plausi="name">'
      +'<label for="lf-email">E-Mail</label><input id="lf-email" name="email" type="email" autocomplete="email" required data-plausi="email">'
      +'<label for="lf-tel">Telefon (für Rückfragen)</label><input id="lf-tel" name="tel" type="tel" autocomplete="tel" required data-plausi="telefon">'
      +'<div class="consent"><input type="checkbox" id="cons" style="width:auto"><label for="cons" style="margin:0">Ich bin einverstanden, dass mich VersicherungsFuchs zu meiner Anfrage kontaktiert. '
      +'<a href="/datenschutz.html" style="color:var(--acc)">Datenschutz</a>.</label></div>'
      +'<div id="lead-msg" style="margin-top:10px"></div>'
      +'<button class="btn-primary btn-lg" id="lead-btn" type="submit" style="margin-top:14px;width:100%"><span>Jetzt anfordern</span></button>'
      +'</form></div>';
  }
  html+='<p class="res-foot">Diese Einordnung dient der neutralen Information nach §&nbsp;34d GewO und ersetzt keine individuelle Beratung. '
    +'<a href="/versicherungs-check/" style="color:var(--acc)">Zurück zu allen Checks</a></p>';

  document.getElementById('res').innerHTML=html;

  var f=document.getElementById('leadform');
  if(!f) return; // Voranfrage-Zweig: kein Formular auf dieser Seite (Lead-Erfassung auf /voranfrage/)
  // Plausi-Pruefung vor dem eigenen Submit-Handler anhaengen (Formular entsteht erst per innerHTML).
  if(window.IsuPlausi) IsuPlausi.anschliessen(f);
  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(f.botcheck.value) return;
    var msg=document.getElementById('lead-msg'), btn=document.getElementById('lead-btn');
    var name=f.name.value.trim(), email=f.email.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.innerHTML='<span style="color:#ffb4a8">Bitte geben Sie eine gültige E-Mail-Adresse an.</span>'; f.email.focus(); return; }
    if(!document.getElementById('cons').checked){ msg.innerHTML='<span style="color:#ffb4a8">Bitte bestätigen Sie die Einwilligung.</span>'; return; }
    btn.disabled=true; btn.querySelector('span').textContent='Wird gesendet …';
    fetch('https://api.versicherungs-fuchs.online/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,email:email,answers:answers,
        source:check.leadSource,ampel_status:r.ampel,legal_scope:'34d',voranfrage:!!r.voranfrage,
        phone:f.tel.value.trim(),
        extra:Object.assign({tel:f.tel.value.trim()}, window.vfExtra?window.vfExtra():{})})})
    .then(function(x){ if(!x.ok) throw new Error('status '+x.status); return x.json().catch(function(){return {};}); }).then(function(j){
      msg.innerHTML='<div class="res-vor" style="margin:0"><strong>Danke! Ihre Anfrage ist bei uns eingegangen.</strong>'
        +'<p style="color:var(--txt2,#8888a0);margin:.3em 0 0">Ein unabhängiger Berater meldet sich bei Ihnen.</p></div>';
      f.querySelector('#lead-btn').style.display='none';
    }).catch(function(){
      btn.disabled=false; btn.querySelector('span').textContent='Jetzt anfordern';
      msg.innerHTML='<span style="color:#ffb4a8">Senden nicht möglich. Bitte per E-Mail an <a href="mailto:info@versicherungs-fuchs.online">info@versicherungs-fuchs.online</a>.</span>';
    });
  });
})();
</script>
<script>
/* Google Ads: Conversion "VersicherungsFuchs - Check-Anfrage abgeschickt".
   Statt jeden einzelnen fetch-Aufruf anzufassen, wird window.fetch einmal
   umhuellt: jede erfolgreiche Antwort von /api/lead meldet die Conversion.
   Das faengt alle Formularwege dieser Seite ab, auch kuenftige. */
(function(){
  if (window.__vfFetchHooked) return; window.__vfFetchHooked = true;
  var orig = window.fetch;
  if (typeof orig !== 'function') return;
  window.fetch = function(){
    var url = arguments[0];
    var pfad = (typeof url === 'string' ? url : (url && url.url) || '');
    var p = orig.apply(this, arguments);
    if (pfad.indexOf('/api/lead') !== -1) {
      p.then(function(r){
        if (r && r.ok && typeof window.vfAdsConversion === 'function') window.vfAdsConversion();
      }).catch(function(){ /* Netzfehler: keine Conversion, absichtlich still */ });
    }
    return p;
  };
})();
</script>

</body>
